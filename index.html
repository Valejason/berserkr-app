<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Quest Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Alegreya+Sans:wght@400;500;700&family=JetBrains+Mono:wght@600&display=swap">
<style>
:root{
  --bg:#eef1f0; --surface:#ffffff; --ink:#1d2a2c; --muted:#5b6b6c; --line:#d5dddc;
  --accent:#1f6f6b; --accent-ink:#ffffff; --brass:#a87b2a; --good:#2e7d4f; --bad:#b0412e;
  --display:"Alegreya SC",Georgia,serif; --body:"Alegreya Sans",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121a1b; --surface:#1a2526; --ink:#e4ecea; --muted:#9aaead; --line:#2c3a3b;
  --accent:#4fb3ac; --accent-ink:#0d1516; --brass:#d6a64e; --good:#5cc489; --bad:#e57a63; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
h1{font-size:1.6rem;letter-spacing:.02em}
h2{font-size:1.3rem}
.date{color:var(--muted);font-size:.9rem}
nav{display:flex;gap:6px;margin:14px 0 20px;border-bottom:1px solid var(--line)}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 4px;font:600 1rem var(--body);color:var(--muted);cursor:pointer}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.label{font:600 .72rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
section{display:flex;flex-direction:column;gap:18px}
.quote{border-left:3px solid var(--line);padding-left:14px}
.quote p{margin:4px 0 2px;font-size:1.15rem;line-height:1.4}
.quote cite{color:var(--muted);font-style:normal;font-size:.9rem}
.quote.genji{border-color:var(--good)}
.quote.exist{border-color:var(--brass)}
hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{flex:1;min-width:70px;padding:8px 6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;font:600 .9rem var(--body);cursor:pointer}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.days small{display:block;font-weight:400;opacity:.8}
.cardio{color:var(--muted);font-size:.95rem}
.ex{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ex .nm{flex:1;min-width:0}
.ex .nm b{display:block}
.ex .nm span{color:var(--muted);font-size:.88rem}
.sets{display:flex;gap:6px}
.sets button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--muted);font:600 .85rem var(--mono);cursor:pointer}
.sets button.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 16px;font:700 1rem var(--body);cursor:pointer}
.btn.ghost{background:none;color:var(--accent);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chap{color:var(--muted);font-size:.9rem}
.scene{font-size:1.12rem;line-height:1.55;margin:0}

/* Two-hero turns */
.turns{display:flex;flex-direction:column;gap:16px}
.turn{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:12px}
.turn.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.turn-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.turn-head h3{font-size:1.2rem;color:var(--accent)}
.status{font:600 .78rem var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.status.done{color:var(--good)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;justify-content:space-between;gap:12px;align-items:center;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:500 1rem var(--body);cursor:pointer}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default;opacity:.55}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;opacity:1}
.choice .dc{font:600 .8rem var(--mono);color:var(--brass);white-space:nowrap;text-align:right}
.choice .sk{display:block;color:var(--muted);font-size:.85rem}
.tray{display:flex;align-items:center;gap:14px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.die{width:84px;height:84px;flex:none;cursor:pointer;border:0;background:none;padding:0}
.die:disabled{cursor:default}
.die svg{width:100%;height:100%;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.die.spin svg{transform:rotate(720deg) scale(1.08)}
.die polygon{fill:var(--accent);stroke:var(--brass);stroke-width:3}
.die text{fill:var(--accent-ink);font:700 34px var(--mono)}
.need{font:600 .9rem var(--mono);color:var(--muted)}
.result{padding:12px;border-radius:10px;border:1px solid var(--line)}
.result.win{border-color:var(--good)}
.result.lose{border-color:var(--bad)}
.result h4{margin:0;font:700 1.05rem var(--display)}
.result.win h4{color:var(--good)}
.result.lose h4{color:var(--bad)}
.result p{margin:6px 0 0}
.party{padding:14px;border-radius:12px;background:var(--surface);border:2px solid var(--brass)}
.party h3{font-size:1.15rem;color:var(--brass)}
.party p{margin:6px 0 0}
.heroes{display:flex;gap:10px;flex-wrap:wrap}
.heroes label{flex:1;min-width:130px;display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.heroes input{font:500 1rem var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.log{font-size:.92rem;color:var(--muted);display:flex;flex-direction:column;gap:6px;padding-left:18px;margin:0}
details summary{cursor:pointer;color:var(--muted);font-size:.95rem}
@media (prefers-reduced-motion:reduce){.die svg{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Daily Quest Log</h1>
    <div class="date" id="today"></div>
  </header>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-tab="today">Today</button>
    <button role="tab" aria-selected="false" data-tab="lift">Workout</button>
    <button role="tab" aria-selected="false" data-tab="dnd">Adventure</button>
  </nav>

  <section id="today-p">
    <div class="quote exist"><div class="label">Existential</div><p id="q1"></p><cite id="q1a"></cite></div>
    <div class="quote genji"><div class="label">Genji</div><p id="q2"></p><cite>Genji, Overwatch</cite></div>
    <hr>
    <div><div class="label">Up next</div><h2 id="nextDay"></h2><div class="cardio">30 min uphill treadmill walk, then 3 sets each</div></div>
    <div class="row"><button class="btn" id="goLift">Open workout</button><button class="btn ghost" id="goDnd">Today's adventure</button></div>
  </section>

  <section id="lift-p" hidden>
    <div class="days" id="days"></div>
    <div><h2 id="dayTitle"></h2><div class="cardio" id="dayNote"></div></div>
    <div id="exList"></div>
    <div class="row"><button class="btn" id="finish">Mark day complete</button><button class="btn ghost" id="resetDay">Clear sets</button></div>
  </section>

  <section id="dnd-p" hidden>
    <div>
      <div class="label">The Ember Lantern</div>
      <h2 id="chTitle"></h2>
      <div class="chap" id="chNum"></div>
    </div>
    <p class="scene" id="scene"></p>
    <div class="turns" id="turns"></div>
    <div class="party" id="party" hidden><h3 id="partyH"></h3><p id="partyP"></p></div>
    <div class="row" id="nextRow" hidden><button class="btn" id="nextCh">Next chapter</button><span class="chap" id="nextHint"></span></div>
    <hr>
    <details id="heroBox">
      <summary>Heroes and story so far</summary>
      <div class="heroes" style="margin-top:12px">
        <label for="h1">Hero one<input id="h1" maxlength="20"></label>
        <label for="h2">Hero two<input id="h2" maxlength="20"></label>
      </div>
      <ol class="log" id="log" style="margin-top:14px"></ol>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="restart">Restart campaign</button><span class="chap" id="restartMsg"></span></div>
    </details>
  </section>
</div>

<script>
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=new Date();
const dayKey=now.toISOString().slice(0,10);
const dayNum=Math.floor(now.getTime()/864e5);
$("today").textContent=now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});

/* ---------- Quotes ---------- */
const EXIST=[
 ["One must imagine Sisyphus happy.","Albert Camus"],
 ["He who has a why to live can bear almost any how.","Friedrich Nietzsche"],
 ["Life can only be understood backwards; but it must be lived forwards.","Søren Kierkegaard"],
 ["Man is condemned to be free.","Jean-Paul Sartre"],
 ["In the midst of winter, I found there was, within me, an invincible summer.","Albert Camus"],
 ["Between stimulus and response there is a space. In that space is our power to choose our response.","Viktor Frankl"],
 ["Anxiety is the dizziness of freedom.","Søren Kierkegaard"],
 ["Existence precedes essence.","Jean-Paul Sartre"],
 ["The struggle itself toward the heights is enough to fill a man's heart.","Albert Camus"],
 ["Become who you are.","Friedrich Nietzsche"]
];
const GENJI=["Measure twice, cut once.","A steady blade balances the soul.","The dragon becomes me!","Ryūjin no ken wo kurae!","I need healing.","My soul seeks balance."];
const eq=EXIST[dayNum%EXIST.length];
$("q1").textContent="“"+eq[0]+"”";$("q1a").textContent=eq[1];
$("q2").textContent="“"+GENJI[dayNum%GENJI.length]+"”";

/* ---------- Workout ---------- */
const PLAN=[
 {name:"Push",ex:[["Machine chest press","Flat, controlled 2-sec lowering"],["Machine shoulder press","Stop just short of lockout"],["Cable lateral raise","Single arm, light and strict"],["Cable rope pushdown","Spread the rope at the bottom"]]},
 {name:"Pull",ex:[["Lat pulldown","Wide grip, chest up"],["Seated cable row","Squeeze shoulder blades 1 sec"],["Cable face pull","Rope to forehead, elbows high"],["Cable bicep curl","Straight bar, no swinging"]]},
 {name:"Legs",ex:[["Leg press","Feet mid-platform, full depth"],["Barbell RDL","Hips back, soft knees"],["Seated leg curl","Pause at the squeeze"],["Walking lunges","Dumbbells or bodyweight"]]},
 {name:"Chest + Back",ex:[["Incline machine press","Upper chest, the width that pops in a shirt"],["Cable fly (high to low)","Big stretch, hug at the bottom"],["Chest-supported machine row","Takes lower back out of it"],["Close-grip lat pulldown","Builds the V-taper"]]}
];
let sel=store.get("dq_next",0);
let doneSets=store.get("dq_sets",{});
function renderDays(){
  $("days").innerHTML=PLAN.map((d,i)=>`<button aria-pressed="${i===sel}" data-i="${i}">Day ${i+1}<small>${d.name}</small></button>`).join("");
  $("days").querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;renderLift()});
}
function renderLift(){
  renderDays();
  const d=PLAN[sel];
  $("dayTitle").textContent=`Day ${sel+1}: ${d.name}`;
  $("dayNote").textContent="30 min uphill treadmill walk first. 3 sets each, 8–12 reps, last set close to failure.";
  const s=doneSets[sel]||{};
  $("exList").innerHTML=d.ex.map((e,i)=>`<div class="ex"><div class="nm"><b>${e[0]}</b><span>${e[1]}</span></div><div class="sets">${[0,1,2].map(k=>`<button class="${s[i+"-"+k]?"on":""}" data-k="${i}-${k}" aria-label="${e[0]} set ${k+1}">${k+1}</button>`).join("")}</div></div>`).join("");
  $("exList").querySelectorAll(".sets button").forEach(b=>b.onclick=()=>{
    doneSets[sel]=doneSets[sel]||{};doneSets[sel][b.dataset.k]=!doneSets[sel][b.dataset.k];store.set("dq_sets",doneSets);b.classList.toggle("on");
  });
  $("finish").textContent="Mark day complete";
}
$("finish").onclick=()=>{doneSets[sel]={};store.set("dq_sets",doneSets);sel=(sel+1)%PLAN.length;store.set("dq_next",sel);renderLift();renderNext();$("finish").textContent="Logged. Next up: "+PLAN[sel].name};
$("resetDay").onclick=()=>{doneSets[sel]={};store.set("dq_sets",doneSets);renderLift()};
function renderNext(){const n=store.get("dq_next",0);$("nextDay").textContent=`Day ${n+1}: ${PLAN[n].name}`}

/* ---------- Adventure ---------- */
const STORY=[
 {t:"The Stolen Lantern",s:"Hollowbrook wakes cold. The Ember Lantern, the warm light that has kept winter away from the village for a hundred years, is gone from the town square. Small muddy footprints lead toward the forest, and the miller is acting very nervous.",
  c:[["Follow the muddy tracks","Survival",10,"The tracks are tiny, three-toed, and lead straight to the Whispering Woods. You also find a scrap of red cloth snagged on a branch.","The rain smears the tracks and you lose an hour. By the time you find the trail again the sun is low."],
     ["Question the nervous miller","Persuasion",12,"The miller admits he saw a small cloaked figure at midnight, carrying a glow 'like a captured sunrise.' He gives you a sack of bread for the road.","The miller clams up and shoos you out. You leave with flour on your boots and no answers."],
     ["Climb the bell tower to look around","Athletics",13,"From the top you spot a thin trail of smoke deep in the woods. Now you know exactly where to head.","Your foot slips on an icy rung and you dangle for a scary moment. You make it down safely, but your pride is bruised."]]},
 {t:"The Whispering Woods",s:"The trees here whisper your names. In the path sits a silver fox with three tails. 'No one passes,' it says, 'unless they give me something I want.'",
  c:[["Answer its riddle","Intelligence",12,"'What has roots no one sees, is taller than trees, yet never grows?' You answer: a mountain! The fox bows and shows you a hidden shortcut.","You guess 'a shadow.' The fox laughs and makes you take the long way around a briar patch."],
     ["Offer it food","Animal Handling",9,"The fox gobbles the bread and decides it likes you. It promises to help you once, when you need it most.","The fox sniffs the food, sneezes, and runs off with your spare boot."],
     ["Sneak past it","Stealth",14,"You tiptoe through the ferns without a sound. The fox never even turns its head.","A twig snaps. The fox yips and every bird in the woods screeches. Anyone ahead now knows you are coming."]]},
 {t:"Goblin Toll Bridge",s:"A rickety rope bridge crosses a ravine. Four goblins in pot-helmets block it. 'Toll is three shinies or one good joke!'",
  c:[["Tell them a joke","Performance",11,"Your joke lands so hard one goblin falls over laughing. They let you cross and give you a dented but useful shield.","Silence. A goblin coughs. They charge you double and you hand over your last copper coins."],
     ["Trick them into a fight with each other","Deception",13,"You convince them one of them is hiding shinies in his helmet. They pile on each other while you stroll across.","They see right through it and chase you across the bridge, throwing pinecones."],
     ["Charge straight across","Strength",14,"You bowl through them like a battering ram. Goblins tumble harmlessly into a soft snowbank below.","The bridge sways and you have to grab the ropes. The goblins steal your map while you hang on."]]},
 {t:"The Ruined Watchtower",s:"A blizzard rolls in, so you take shelter in a crumbling tower. On the wall is a faded painting of a dragon made of ice, sleeping under a mountain.",
  c:[["Study the mural","History",11,"The mural tells of a frost dragon that sleeps as long as the Ember Lantern burns far away. If the lantern moves near it, it will wake.","The paint is too faded to read. You have an uneasy feeling about the dragon's open eye."],
     ["Search for supplies","Investigation",10,"You find an old chest with two warm cloaks and a healing potion.","You find a chest full of very angry spiders. Nobody is hurt, but nobody sleeps much."],
     ["Keep watch through the night","Perception",13,"At midnight you spot a tiny glowing figure on the ridge heading toward Ember Hill. Now you know the thief's destination.","You doze off. In the morning there are tiny footprints all around the tower. Someone visited."]]},
 {t:"The River of Glass",s:"The river ahead is frozen solid, but cracks are spreading across it like spider webs. The other side is your only path.",
  c:[["Cross carefully, one step at a time","Dexterity",12,"Light-footed and steady, you reach the far bank just as the ice behind you groans and splits.","Your leg plunges through. You scramble out, soaked and shivering, and need a fire before moving on."],
     ["Build a raft from fallen logs","Intelligence",13,"Your raft is ugly but brilliant. It slides over the ice and floats over the cracks.","The raft falls apart halfway. You make it across by jumping log to log like a frog."],
     ["Look for another way","Survival",11,"Downstream you find an old stone bridge buried in snow. Safe and dry.","You find a bridge, but a grumpy troll lives under it and charges you a snack to pass."]]},
 {t:"The Tinker Owl",s:"A brass owl lies in the snow, one wing bent. Its eyes flicker weakly. A tiny map is etched on its chest, but it is broken.",
  c:[["Repair the owl","Tinkering (Intelligence)",13,"With a few twists the owl whirs to life, hoots, and becomes your guide. Its name tag says 'Bolt.'","A spring flies off and pokes you in the nose. The owl still works, but it only flies backwards."],
     ["Talk to it kindly","Charisma",11,"The owl clicks happily and projects a glowing map of the mine tunnels on the snow.","The owl blinks at you, says 'Error,' and goes back to sleep."],
     ["Follow its flashing eyes","Perception",12,"Its eyes blink in a pattern pointing to a secret entrance in the hillside.","You follow the flashes in circles for an hour. They were just blinking."]]},
 {t:"Mines of Ember Hill",s:"Inside Ember Hill the tunnels twist in every direction. Far below, you see warm orange light flickering off the walls.",
  c:[["Light a torch and push deeper","Constitution",10,"You march through the smoky tunnels without slowing down and reach a huge cavern.","The smoke makes you cough and you have to rest. Something small scurries away in the dark."],
     ["Map the tunnels as you go","Wisdom",12,"Your careful map keeps you from getting lost and shows a safe path down.","You take three wrong turns and end up right back at the entrance. Twice."],
     ["Press an ear to the walls","Perception",13,"You hear many tiny voices singing a sad song, and follow the sound.","All you hear is your own heartbeat. And something very large breathing, far, far below."]]},
 {t:"The Thief Revealed",s:"In the cavern you find a clan of small, shivering kobolds huddled around the Ember Lantern. A young kobold named Pip steps forward. 'Please! Our fire went out. Without the lantern, my family will freeze.'",
  c:[["Talk it out and find a deal","Persuasion",12,"Pip agrees to bring the lantern home if you help her clan find another source of warmth. A new friend joins the story.","Pip panics and hides the lantern behind her back. The clan doesn't trust you yet."],
     ["Grab the lantern and run","Dexterity",14,"You snatch it and dash, but Pip's crying face stays with you. Is this the right thing?","Pip is faster. She scrambles up a wall with the lantern and glares down at you."],
     ["Find another heat source in the mine","Nature",13,"You discover a vein of glowing fire-crystals. The kobolds cheer, and Pip hands you the lantern with a hug.","The crystals you find are just shiny rocks. The kobolds are disappointed."]]},
 {t:"The Frost Dragon Wakes",s:"The ground shakes. The lantern's light has reached deep enough to wake the frost wyrmling from the mural. Its icy breath fills the cavern. The kobolds scream.",
  c:[["Shield the kobolds","Constitution",13,"You stand firm in front of the little ones. The frost washes over you and you don't budge an inch. Pip looks at you like a hero.","The cold knocks you back, but every kobold makes it to safety. You are freezing but proud."],
     ["Distract the dragon","Acrobatics",12,"You flip, dodge, and taunt it across the cavern while everyone escapes. The dragon gets dizzy and flops over.","You trip over a rock. The dragon sniffs you, sneezes, and you are covered in frost."],
     ["Shine the lantern in its eyes","Arcana",14,"The magic light blazes. The dragon blinks, yawns, and curls up back to sleep, snoring like a kettle.","The light only makes it grumpier. It flies off into the mountains. You'll see it again someday."]]},
 {t:"Homecoming",s:"You return to Hollowbrook with the Ember Lantern glowing bright. Pip and the kobolds come with you, holding fire-crystals. The whole village pours into the square.",
  c:[["Lead the celebration","Performance",10,"You tell the whole tale around the lantern and the village crowns you Wardens of Hollowbrook.","You trip over the speech, but everyone cheers anyway. Heroes don't need perfect words."],
     ["Make a pact between the village and the kobolds","Persuasion",11,"The village and the kobold clan promise to share warmth every winter. Pip becomes your official sidekick.","The mayor is nervous, but agrees to try. It's a start."],
     ["Look for signs of the next adventure","Insight",12,"Bolt the owl lands on your shoulder with a new map. A red X marks a sunken castle. Book Two awaits.","Nothing yet. But the frost dragon's roar echoes from the far mountains."]]}
];

const fresh=()=>({ch:0,log:[],picks:[null,null],rolls:[null,null],day:null});
let camp=store.get("dq_camp2",null)||fresh();
if(!Array.isArray(camp.picks))camp=fresh();
let heroes=store.get("dq_heroes",["Hero one","Hero two"]);
$("h1").value=heroes[0];$("h2").value=heroes[1];
if(heroes[0]==="Hero one"&&heroes[1]==="Hero two")$("heroBox").open=true;
["h1","h2"].forEach((id,i)=>$(id).oninput=e=>{heroes[i]=e.target.value.trim()||("Hero "+(i?"two":"one"));store.set("dq_heroes",heroes);renderDnd()});
const save=()=>store.set("dq_camp2",camp);
const bothDone=()=>camp.rolls[0]!=null&&camp.rolls[1]!=null;

function heroResult(h){
  const o=STORY[camp.ch].c[camp.picks[h]],r=camp.rolls[h],win=r>=o[2];
  const head=r===20?"Natural 20! Critical success!":r===1?"Natural 1! Oh no...":win?`Success (${r} vs DC ${o[2]})`:`Failed (${r} vs DC ${o[2]})`;
  const body=(win?o[3]:o[4])+(r===20?" The gods smile on you!":r===1?" Somewhere, a goblin laughs.":"");
  return `<div class="result ${win?"win":"lose"}"><h4>${head}</h4><p>${esc(body)}</p></div>`;
}

function turnHTML(h){
  const c=STORY[camp.ch],p=camp.picks[h],r=camp.rolls[h];
  const name=esc(heroes[h]);
  const active=r==null&&(h===0||camp.rolls[0]!=null||p!=null);
  const status=r!=null?"Done":p==null?"Choose":"Roll!";
  let html=`<div class="turn ${r==null&&active?"active":""}" data-h="${h}">
    <div class="turn-head"><h3>${name}'s turn</h3><span class="status ${r!=null?"done":""}">${status}</span></div>`;
  html+=`<div class="choices">${c.c.map((o,i)=>`<button class="choice" data-h="${h}" data-i="${i}" aria-pressed="${p===i}" ${r!=null?"disabled":""}><span>${esc(o[0])}<span class="sk">${esc(o[1])} check</span></span><span class="dc">DC ${o[2]}</span></button>`).join("")}</div>`;
  if(p!=null){
    html+=`<div class="tray"><button class="die" data-h="${h}" aria-label="${name}: roll the d20" ${r!=null?"disabled":""}><svg viewBox="0 0 100 100"><polygon points="50,4 93,28 93,72 50,96 7,72 7,28"/><text x="50" y="62" text-anchor="middle">${r??20}</text></svg></button>
      <div class="need">${r==null?`${name}, tap the die.<br>Need ${c.c[p][2]} or higher.`:`${name} rolled ${r}`}</div></div>`;
  }
  if(r!=null)html+=heroResult(h);
  return html+`</div>`;
}

function renderDnd(){
  $("restartMsg").textContent="";
  if(camp.ch>=STORY.length){
    $("chTitle").textContent="Campaign complete";
    $("chNum").textContent=`${STORY.length} chapters finished`;
    $("scene").textContent=`${heroes[0]} and ${heroes[1]} saved Hollowbrook. Restart below to play it again with new choices.`;
    $("turns").innerHTML="";$("party").hidden=true;$("nextRow").hidden=true;
    renderLog();return;
  }
  const c=STORY[camp.ch];
  $("chTitle").textContent=c.t;
  $("chNum").textContent=`Chapter ${camp.ch+1} of ${STORY.length} · both heroes choose and roll`;
  $("scene").textContent=c.s;
  $("turns").innerHTML=turnHTML(0)+turnHTML(1);
  $("turns").querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const h=+b.dataset.h;if(camp.rolls[h]!=null)return;camp.picks[h]=+b.dataset.i;save();renderDnd()});
  $("turns").querySelectorAll(".die").forEach(b=>b.onclick=()=>roll(+b.dataset.h,b));
  renderParty();renderLog();
}

function renderParty(){
  if(!bothDone()){$("party").hidden=true;$("nextRow").hidden=true;return}
  const c=STORY[camp.ch];
  const wins=[0,1].filter(h=>camp.rolls[h]>=c.c[camp.picks[h]][2]).length;
  const [a,b]=heroes;
  let H,P;
  if(wins===2){H="Party victory!";P=`${a} and ${b} both pulled it off. The party moves on in style.`}
  else if(wins===1){const w=camp.rolls[0]>=c.c[camp.picks[0]][2]?a:b,l=w===a?b:a;H="Teamwork saves the day";P=`${w} came through, so ${l} gets a hand up. The party presses on together.`}
  else{H="A rough day for the party";P=`${a} and ${b} both stumbled, but heroes don't quit. The story goes on, just a bit messier.`}
  if(camp.rolls[0]===20&&camp.rolls[1]===20)P+=" DOUBLE NATURAL 20! Legendary!";
  $("party").hidden=false;$("partyH").textContent=H;$("partyP").textContent=P;
  $("nextRow").hidden=false;
  $("nextHint").textContent=camp.day===dayKey?"Or save it for tomorrow.":"";
}

function roll(h,btn){
  if(camp.rolls[h]!=null||camp.picks[h]==null)return;
  const txt=btn.querySelector("text");btn.classList.add("spin");btn.disabled=true;let n=0;
  const tick=setInterval(()=>{txt.textContent=1+Math.floor(Math.random()*20);if(++n>12)clearInterval(tick)},50);
  setTimeout(()=>{
    const a=new Uint32Array(1);crypto.getRandomValues(a);camp.rolls[h]=1+(a[0]%20);camp.day=dayKey;
    if(bothDone()){
      const c=STORY[camp.ch];
      const part=k=>{const o=c.c[camp.picks[k]];return `${heroes[k]}: ${o[0]} (rolled ${camp.rolls[k]}, ${camp.rolls[k]>=o[2]?"success":"fail"})`};
      camp.log.push(`${c.t} — ${part(0)}; ${part(1)}`);
    }
    save();renderDnd();
  },700);
}

$("nextCh").onclick=()=>{camp.ch++;camp.picks=[null,null];camp.rolls=[null,null];save();renderDnd();window.scrollTo({top:0,behavior:"smooth"})};
let armed=false;
$("restart").onclick=()=>{
  if(!armed){armed=true;$("restartMsg").textContent="Tap again to wipe progress";setTimeout(()=>{armed=false;$("restartMsg").textContent=""},3000);return}
  armed=false;camp=fresh();save();renderDnd();
};
function renderLog(){$("log").innerHTML=camp.log.length?camp.log.map(l=>`<li>${esc(l)}</li>`).join(""):"<li>No chapters played yet.</li>"}

/* ---------- Tabs ---------- */
function tab(n){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===n));
  ["today","lift","dnd"].forEach(t=>$(t+"-p").hidden=t!==n);
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
$("goLift").onclick=()=>tab("lift");$("goDnd").onclick=()=>tab("dnd");
renderNext();renderLift();renderDnd();
</script>
</body>
</html>
